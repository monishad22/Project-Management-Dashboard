<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StockPilot | Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/login.css') }}"
    >

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="brand-section">

            <div class="brand-logo">
                SP
            </div>

            <h1>
                StockPilot
            </h1>

            <p>
                Smart Inventory Management
            </p>

        </div>


        <form id="loginForm">

            <div
                id="loginError"
                class="alert alert-danger d-none"
            ></div>


            <div class="mb-3">

                <label
                    for="username"
                    class="form-label"
                >
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
                class="btn btn-primary w-100"
            >
                Sign In
            </button>

        </form>


        <div class="demo-login">

            <strong>
                Demo Admin
            </strong>

            <div>
                Username:
                <code>admin</code>
            </div>

            <div>
                Password:
                <code>Admin@123</code>
            </div>

        </div>

    </div>

</div>


<script
    src="{{ url_for('static', filename='js/login.js') }}"
></script>

</body>

</html>
